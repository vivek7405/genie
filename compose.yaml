# genie under docker compose on a laptop, using the same Dockerfile, one
# service:
#
#   docker compose up --build   then open http://localhost:8080
#
# Production runs on pilots from compose.pilots.yaml (`pilot deploy` picks that
# file first). This one keeps a host port mapping and a local named volume so
# the SQLite file survives `docker compose down`. It is also the only place the
# SIGTERM drain is exercised: `docker compose stop` signals the process, while
# a pilots redeploy suspends the replica without a signal.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # The same path the pilots volume uses, so the two files never differ.
      DATABASE_URL: file:/data/genie.db
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-please-at-least-32-characters!}
      # Uncomment to back cache / sessions / rate-limiting / pub-sub with Redis
      # instead of the in-memory defaults.
      # REDIS_URL: redis://redis:6379
    volumes:
      - app-data:/data
    # Readiness gate: hold the service "starting" until /__webjs/ready returns
    # 200 (fully warm). Same probe as the Dockerfile HEALTHCHECK; dependency-free.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/__webjs/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  app-data:
